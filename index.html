<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사업 흐름 계획표 · KCOC</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
@font-face {
  font-family: 'Pretendard';
  src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
  font-weight: 45 920;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap');

:root{
  --navy: #17233d;
  --navy-soft: #2c3b5c;
  --slate: #5b6579;
  --paper: #f4f3ee;
  --paper-line: #dedad0;
  --ink: #1c2130;
  --amber: #c1852f;
  --amber-soft: #f3e2c4;
  --teal: #29685c;
  --rose: #a8493f;
  --grey: #6d7484;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  line-height:1.5;
  padding-bottom:80px;
}
.wrap{max-width:900px;margin:0 auto;padding:0 24px;}

header.top{border-bottom:1px solid var(--navy);padding:40px 0 0;}
header.top .top-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;padding-bottom:22px;}
h1{font-family:'Noto Serif KR', serif;font-weight:700;font-size:28px;margin:0 0 6px;color:var(--navy);letter-spacing:-0.01em;}
.subtitle{color:var(--slate);font-size:14px;margin:0;}
.org-tag{font-size:13px;color:var(--navy-soft);border:1px solid var(--navy-soft);padding:5px 12px;border-radius:2px;white-space:nowrap;}

.year-tabs{display:flex;gap:2px;}
.year-tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--slate);font-family:'Pretendard';font-size:15px;font-weight:600;padding:12px 18px;cursor:pointer;margin-bottom:-1px;}
.year-tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--amber);}
.year-tab:hover{color:var(--navy);}
.year-tab:focus-visible{outline:2px solid var(--amber);outline-offset:-2px;}
.year-period{font-size:13px;color:var(--slate);padding:14px 0 24px;}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
.filter-chip{border:1px solid var(--paper-line);background:#fff;color:var(--slate);font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.filter-chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.filter-chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
.filter-chip[aria-pressed="true"] .dot{outline:1.5px solid #fff;}
.filter-chip:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

.state-msg, .tl-empty{color:var(--grey);font-size:14px;padding:28px 0;text-align:center;}

/* 상/하반기 2단 레이아웃 */
.timeline-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;}
.timeline-col{min-width:0;}
.half-label{
  font-family:'Noto Serif KR', serif;
  font-weight:700;
  font-size:15px;
  color:var(--navy-soft);
  border-bottom:1px solid var(--navy-soft);
  padding-bottom:9px;
  margin-bottom:6px;
}
@media (max-width:760px){
  .timeline-grid{grid-template-columns:1fr;gap:0;}
  .timeline-col + .timeline-col{margin-top:28px;}
}

/* 타임라인 */
.timeline{position:relative;padding-left:26px;margin-bottom:20px;}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--paper-line);}

.tl-month{
  position:relative;
  font-family:'Noto Serif KR', serif;
  font-weight:700;
  font-size:17px;
  color:var(--navy);
  margin:30px 0 14px;
}
.tl-month:first-child{margin-top:0;}
.tl-month::before{
  content:'';
  position:absolute;
  left:-26px;
  top:6px;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--navy);
  border:3px solid var(--paper);
}

.tl-today{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  margin:18px 0;
  font-size:12px;
  font-weight:700;
  color:var(--amber);
}
.tl-today::before{
  content:'';
  position:absolute;
  left:-26px;
  top:50%;
  transform:translateY(-50%);
  width:12px;height:12px;
  border-radius:50%;
  background:var(--amber);
  border:3px solid var(--paper);
  box-shadow:0 0 0 2px var(--amber);
}
.tl-today-line{flex:1;height:1px;background:var(--amber);opacity:0.4;}

.tl-item{position:relative;padding-bottom:22px;}
.tl-item::before{
  content:'';
  position:absolute;
  left:-22px;
  top:5px;
  width:8px;height:8px;
  border-radius:50%;
  background:var(--dot, var(--navy));
}
.tl-card{
  background:#fff;
  border:1px solid var(--paper-line);
  border-radius:4px;
  padding:12px 14px;
}
.tl-date{font-size:12px;color:var(--slate);font-weight:600;margin-bottom:4px;}
.tl-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.type-badge{font-size:11px;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block;}

footer{max-width:900px;margin:40px auto 0;padding:20px 24px 0;border-top:1px solid var(--paper-line);font-size:12px;color:var(--grey);display:flex;justify-content:space-between;}
footer a{color:var(--grey);}

@media (max-width:600px){
  h1{font-size:22px;}
  .year-tab{padding:10px 12px;font-size:14px;}
  .timeline{padding-left:22px;}
  .tl-month::before{left:-22px;}
  .tl-today::before{left:-22px;}
  .tl-item::before{left:-19px;}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div>
        <h1>사업 흐름 계획표</h1>
        <p class="subtitle">해외 사업 운영에 참고할 일정을 안내합니다</p>
      </div>
      <span class="org-tag">KCOC 파트너십지원부 · 수행기관 공유용</span>
    </div>
    <div class="year-tabs" id="yearTabs" role="tablist" aria-label="사업 연차 선택"></div>
  </div>
</header>

<main class="wrap">
  <p class="year-period" id="yearPeriod"></p>
  <div id="loadingMsg" class="state-msg">일정을 불러오는 중입니다…</div>

  <div id="appBody" style="display:none;">
    <div class="filters" id="filters" role="group" aria-label="일정 유형 필터"></div>
    <div class="timeline-grid">
      <div class="timeline-col">
        <div class="half-label">상반기 (1~6월)</div>
        <div class="timeline" id="timelineH1"></div>
      </div>
      <div class="timeline-col">
        <div class="half-label">하반기 (7~12월)</div>
        <div class="timeline" id="timelineH2"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap" style="max-width:none;padding:0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
    <span>일정 관련 문의: KCOC 파트너십지원부</span>
    <a href="./admin.html">운영진 전용</a>
  </div>
</footer>

<script>
const DATA_URL = './events.json'; // events.json이 같은 폴더에 있어야 합니다.

const TYPE_COLORS = {
  "컨설팅": { dot: "#c1852f", bg: "#f3e2c4", text: "#7a5217" },
  "모니터링": { dot: "#29685c", bg: "#d9e9e2", text: "#1c4038" },
  "보고시작": { dot: "#3f6690", bg: "#dbe4ee", text: "#24435f" },
  "보고마감": { dot: "#a8493f", bg: "#f1dcd6", text: "#7a2f27" },
  "기타": { dot: "#6d7484", bg: "#e4e2da", text: "#454b56" }
};
const TYPE_ORDER = ["컨설팅", "모니터링", "보고시작", "보고마감", "기타"];

let DATA = null;          // { years: {...}, events: [...] }
let YEAR_ORDER = [];
let activeTypes = new Set(TYPE_ORDER);
let activeYear = null;

function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

function weekLabel(e){
  if(!e.roughMonth || !e.weekStart || !e.weekEnd) return '';
  if(e.weekStart === e.weekEnd) return `${e.roughMonth}월 ${e.weekStart}주차`;
  return `${e.roughMonth}월 ${e.weekStart}~${e.weekEnd}주차`;
}

function formatEventRange(e){
  if(e.precision === 'week'){
    const wl = weekLabel(e);
    if(wl) return wl;
  }
  const d = new Date(e.date);
  const w = Math.ceil(d.getDate() / 7); // 1~7일=1주차, 8~14일=2주차 … 단순 7일 단위
  return `${d.getMonth()+1}월 ${w}주차`;
}

async function loadData(){
  try{
    const res = await fetch(DATA_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('불러오기 실패');
    DATA = await res.json();
    YEAR_ORDER = Object.keys(DATA.years);
    activeYear = pickDefaultYear();
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('appBody').style.display = '';
    renderAll();
  }catch(err){
    document.getElementById('loadingMsg').textContent = '일정을 불러오지 못했습니다. events.json 파일 위치를 확인해주세요.';
  }
}

function pickDefaultYear(){
  const today = todayStr();
  for(const key of YEAR_ORDER){
    const evs = DATA.events.filter(e => e.year === key);
    if(evs.some(e => e.date >= today)) return key;
  }
  return YEAR_ORDER[YEAR_ORDER.length - 1];
}

function currentEvents(){
  return DATA.events.filter(e => e.year === activeYear);
}

function renderYearTabs(){
  const el = document.getElementById('yearTabs');
  el.innerHTML = '';
  YEAR_ORDER.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'year-tab';
    btn.type = 'button';
    btn.role = 'tab';
    btn.setAttribute('aria-selected', key === activeYear);
    btn.textContent = DATA.years[key].label;
    btn.addEventListener('click', () => {
      if(activeYear === key) return;
      activeYear = key;
      renderAll();
    });
    el.appendChild(btn);
  });
  document.getElementById('yearPeriod').textContent = DATA.years[activeYear].period;
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  TYPE_ORDER.forEach(type => {
    const btn = document.createElement('button');
    btn.className = 'filter-chip';
    btn.type = 'button';
    btn.setAttribute('aria-pressed', activeTypes.has(type));
    btn.innerHTML = `<span class="dot" style="background:${TYPE_COLORS[type].dot}"></span>${type}`;
    btn.addEventListener('click', () => {
      if(activeTypes.has(type)){
        if(activeTypes.size > 1) activeTypes.delete(type);
      } else {
        activeTypes.add(type);
      }
      renderAll();
    });
    el.appendChild(btn);
  });
}

function appendTodayMarker(container){
  const todayEl = document.createElement('div');
  todayEl.className = 'tl-today';
  todayEl.innerHTML = `<span>오늘</span><span class="tl-today-line"></span>`;
  container.appendChild(todayEl);
}

function renderHalf(container, items, allowTrailingToday){
  container.innerHTML = '';
  if(items.length === 0){
    container.innerHTML = '<div class="tl-empty">해당하는 일정이 없습니다.</div>';
    return;
  }
  const today = todayStr();
  let todayInserted = false;
  let lastMonthKey = null;

  items.forEach(e => {
    if(!todayInserted && e.date >= today){
      todayInserted = true;
      appendTodayMarker(container);
    }

    const d = new Date(e.date);
    const monthKey = `${d.getFullYear()}-${d.getMonth()}`;
    if(monthKey !== lastMonthKey){
      lastMonthKey = monthKey;
      const monthEl = document.createElement('div');
      monthEl.className = 'tl-month';
      monthEl.textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월`;
      container.appendChild(monthEl);
    }

    const c = TYPE_COLORS[e.type];
    const item = document.createElement('div');
    item.className = 'tl-item';
    item.style.setProperty('--dot', c.dot);
    item.innerHTML = `
      <div class="tl-card">
        <div class="tl-date">${formatEventRange(e)}</div>
        <div class="tl-title">${e.title}</div>
        <span class="type-badge" style="background:${c.bg};color:${c.text}">${e.type}</span>
      </div>`;
    container.appendChild(item);
  });

  if(!todayInserted && allowTrailingToday){
    appendTodayMarker(container);
  }
}

function renderTimeline(){
  const items = currentEvents().filter(e => activeTypes.has(e.type)).sort((a,b)=>a.date.localeCompare(b.date));
  const first = items.filter(e => new Date(e.date).getMonth()+1 <= 6);
  const second = items.filter(e => new Date(e.date).getMonth()+1 >= 7);
  const todayMonth = new Date().getMonth()+1;
  renderHalf(document.getElementById('timelineH1'), first, todayMonth <= 6);
  renderHalf(document.getElementById('timelineH2'), second, todayMonth >= 7);
}

function renderAll(){
  renderYearTabs();
  renderFilters();
  renderTimeline();
}

loadData();
</script>
</body>
</html>
